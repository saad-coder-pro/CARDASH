<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>App Grid</title>

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/index.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/css/index.css">
<script defer src="keyboard.js"></script>

<style>
:root{
  --bg:#0a0a12;
  --text:#ffffff;
  --muted:rgba(255,255,255,.55);
  --accent:#ff9f0a;
  --accent-2:#ffb340;
  --accent-shadow:rgba(255,159,10,.55);
  --danger:#ff453a;
  --glass-bg: linear-gradient(135deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.05) 55%, rgba(255,255,255,.02) 100%);
  --glass-border: rgba(255,255,255,.16);
  --glass-blur: 32px;
  --radius-lg: 28px;
  --radius-md: 20px;
  --radius-sm: 14px;
  --font: ui-rounded,"SF Pro Rounded","SF Compact Rounded",-apple-system,BlinkMacSystemFont,"Nunito","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html{
  background:var(--bg);
  transition: background .4s ease;
}

body{
  margin:0; padding:0;
  background:transparent;
  color:var(--text);
  font-family:var(--font);
  font-weight:700;
  letter-spacing:-.01em;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  overscroll-behavior-y:none;
}

/* ---------- BACKGROUND LAYERS ---------- */
#bgLayer{
  position:fixed; inset:0;
  z-index:-3;
  background:var(--bg);
  transition: background .4s ease;
}
#bgOverlay{
  position:fixed; inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(1000px 700px at 12% -8%, rgba(10,132,255,.15), transparent 60%),
    radial-gradient(900px 700px at 92% 108%, rgba(191,90,242,.12), transparent 60%),
    radial-gradient(700px 500px at 100% 0%, rgba(255,159,10,.08), transparent 60%);
}
#wallpaperLayer{
  position:fixed; inset:0;
  z-index:-1;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  opacity:0;
  transition:opacity .5s ease;
  pointer-events:none;
  will-change: opacity;
}

/* ---------- GLASS ---------- */
.glass{
  background:var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:
    0 20px 45px -20px rgba(0,0,0,.6),
    0 4px 12px -2px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -1px 0 rgba(255,255,255,.04);
  position:relative;
  isolation:isolate;
}
.glass::before{
  content:"";
  position:absolute; inset:0;
  border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,255,255,.10) 0%, transparent 32%);
  pointer-events:none;
  z-index:0;
}
.glass > *{ position:relative; z-index:1; }

/* ---------- LAYOUT ---------- */
.wrap{
  max-width:1500px;
  margin:0 auto;
  padding: max(20px, env(safe-area-inset-top)) 0 140px;
  position:relative;
}

/* ---------- HEADER ---------- */
header.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding: 10px 30px 26px;
}
header.app-header h1{
  margin:0;
  font-size:32px;
  font-weight:900;
  letter-spacing:-.03em;
  display:flex;
  align-items:center;
  gap:14px;
}
header.app-header h1 i{
  color:var(--accent);
  font-size:26px;
}
.header-actions{ display:flex; align-items:center; gap:12px; }

.icon-btn{
  width:48px; height:48px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--glass-border);
  background:var(--glass-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  color:var(--text);
  font-size:18px;
  cursor:pointer;
  padding:0;
  box-shadow:
    0 10px 24px -12px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.24);
  transition: transform .14s ease, background .18s ease, color .18s ease;
  -webkit-tap-highlight-color:transparent;
  touch-action: manipulation;
}
.icon-btn:hover{ background: rgba(255,255,255,.14); }
.icon-btn:active{ transform: scale(.92); }
.icon-btn.primary{
  background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
  border-color: rgba(255,255,255,.35);
  box-shadow: 0 12px 30px -10px var(--accent-shadow), inset 0 1px 0 rgba(255,255,255,.5);
  color:#1a1000;
  font-weight:900;
}
.icon-btn.primary:hover{ background: linear-gradient(180deg, #ffc266 0%, #ffa826 100%); }
.icon-btn.primary i{
  color:#1a1000;
  text-shadow: 0 1px 0 rgba(255,255,255,.25);
}

/* ---------- GRID (Android TV style — wide tiles) ---------- */
#grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap:20px;
  padding: 0 30px;
}
@media (max-width:900px){
  #grid{ grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:16px; padding: 0 22px; }
}
@media (max-width:640px){
  #grid{ grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap:14px; padding: 0 18px; }
  header.app-header{ padding: 8px 18px 22px; }
  header.app-header h1{ font-size:26px; }
  .icon-btn{ width:44px; height:44px; font-size:17px; }
}
@media (max-width:420px){
  #grid{ grid-template-columns: 1fr; gap:12px; padding: 0 14px; }
}

/* ---------- TILE (16:9 Android-TV style) ---------- */
.tile{
  position: relative;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  transition: transform .2s cubic-bezier(.34,1.4,.64,1), box-shadow .2s ease;
  will-change: transform;
  background: #1a1a24;
  box-shadow:
    0 20px 45px -20px rgba(0,0,0,.7),
    0 4px 12px -2px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.08);
  isolation: isolate;
}
.tile:hover{
  transform: translateY(-4px) scale(1.01);
  box-shadow:
    0 32px 60px -22px rgba(0,0,0,.75),
    0 10px 24px -6px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.28);
}
.tile:active{ transform: scale(.975); }
.tile.pressing{ transform: scale(.96); }

/* Image layer — fills whole tile with crop applied */
.tile-media{
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #14141c;
}
.tile-media img{
  position: absolute;
  display: block;
  max-width: none;
  max-height: none;
  pointer-events: none;
  -webkit-user-drag: none;
  user-select: none;
  transform: translateZ(0);
}

/* FA icon layer — colored gradient bg with centered icon */
.tile-fa-bg{
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--tc1) 0%, var(--tc2) 100%);
}
.tile-fa-icon{
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 62px;
  text-shadow: 0 6px 20px rgba(0,0,0,.35);
  pointer-events: none;
}
.tile-fa-icon i{
  font-size: 62px;
  line-height: 1;
}

/* Dark gradient overlay for text readability */
.tile-overlay{
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 65%;
  background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.15) 40%, rgba(0,0,0,.78) 100%);
  pointer-events: none;
  z-index: 2;
}

/* Top-right indicator dot */
.tile-dot{
  position: absolute;
  top: 12px; right: 12px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px rgba(255,159,10,.8), 0 0 4px rgba(255,159,10,1);
  opacity: 0;
  transition: opacity .2s ease;
  z-index: 3;
}
.tile:hover .tile-dot{ opacity: .9; }

/* Name at bottom with glass pill */
.tile-content{
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 16px 18px;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 10px;
}
.tile-name{
  color: #fff;
  font-size: 15px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 2px 6px rgba(0,0,0,.65);
  letter-spacing:-.005em;
  min-width: 0;
  flex: 1;
}
.tile-icon-mini{
  width: 26px; height: 26px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.2);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-size: 12px;
  color: #fff;
  flex-shrink: 0;
}

/* ---------- EMPTY STATE ---------- */
#emptyState{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding: 100px 24px;
  text-align:center;
  color: var(--muted);
}
#emptyState .eicon{
  width: 100px; height: 100px;
  display:flex; align-items:center; justify-content:center;
  border-radius: 30px;
  background: linear-gradient(180deg, rgba(255,159,10,.20) 0%, rgba(255,159,10,.06) 100%);
  border: 1px solid rgba(255,159,10,.3);
  box-shadow:
    0 20px 40px -18px rgba(255,159,10,.45),
    inset 0 1px 0 rgba(255,255,255,.2);
  color: var(--accent);
  font-size: 48px;
  margin-bottom: 6px;
}
#emptyState .etitle{
  font-size:22px;
  font-weight:900;
  color: var(--text);
  letter-spacing:-.02em;
}
#emptyState .esub{
  font-size:14.5px;
  font-weight:700;
  max-width:400px;
  line-height:1.55;
}
#emptyState .ebtn{
  margin-top:12px;
  padding: 14px 26px;
  border-radius: 999px;
  border:1px solid rgba(255,255,255,.22);
  background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
  color:#1a1000;
  font-family:inherit;
  font-weight:900;
  font-size:14.5px;
  cursor:pointer;
  box-shadow: 0 14px 32px -12px var(--accent-shadow), inset 0 1px 0 rgba(255,255,255,.5);
  display:inline-flex;
  align-items:center;
  gap:10px;
  transition: transform .14s ease, background .18s ease;
}
#emptyState .ebtn i{ color: #1a1000; }
#emptyState .ebtn:hover{ background: linear-gradient(180deg, #ffc266 0%, #ffa826 100%); }
#emptyState .ebtn:active{ transform: scale(.95); }

/* ---------- MODAL / SETTINGS ---------- */
.sheet-backdrop{
  position:fixed;
  inset:0;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 500;
  opacity:0;
  pointer-events:none;
  transition: opacity .24s ease;
  display: flex;
  align-items:center;
  justify-content:center;
  padding: 20px;
}
.sheet-backdrop.open{ opacity:1; pointer-events:auto; }

.sheet{
  width:100%;
  max-width: 540px;
  max-height: calc(100vh - 40px);
  max-height: calc(100dvh - 40px);
  border-radius: var(--radius-lg);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  transform: translateY(30px) scale(.96);
  opacity:0;
  transition: transform .3s cubic-bezier(.34,1.4,.64,1), opacity .2s ease;
  background: linear-gradient(180deg, rgba(38,38,48,.94) 0%, rgba(22,22,30,.97) 100%);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.18);
}
.sheet-backdrop.open .sheet{
  transform: translateY(0) scale(1);
  opacity:1;
}
.sheet.wide{ max-width: 680px; }

.sheet-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding: 22px 26px 16px;
  gap: 12px;
  flex-shrink:0;
}
.sheet-header h2{
  margin:0;
  font-size:21px;
  font-weight:900;
  letter-spacing:-.02em;
}
.sheet-close{
  width:38px; height:38px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.06);
  color:#fff;
  font-size:15px;
  cursor:pointer;
  padding:0;
  transition: background .15s ease, transform .12s ease;
  flex-shrink:0;
}
.sheet-close:hover{ background: rgba(255,255,255,.12); }
.sheet-close:active{ transform: scale(.9); }

.sheet-body{
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 4px 26px 28px;
  overscroll-behavior: contain;
  scrollbar-width: thin;
}
.sheet-body::-webkit-scrollbar{ width:6px; }
.sheet-body::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.16); border-radius:3px; }

.sheet-footer{
  display:flex;
  align-items:center;
  gap: 10px;
  padding: 16px 26px 24px;
  border-top: 1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}

/* ---------- FORM ---------- */
.field-label{
  display:block;
  font-size:11px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
  color: rgba(255,255,255,.5);
  margin: 22px 4px 10px;
}
.field-label:first-child{ margin-top: 8px; }

.field-input{
  width: 100%;
  padding: 15px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255,255,255,.10);
  background: rgba(255,255,255,.05);
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  outline:none;
  transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
  -webkit-appearance:none;
  appearance:none;
  caret-color: var(--accent);
}
.field-input:focus{
  border-color: rgba(255,159,10,.6);
  background: rgba(255,255,255,.08);
  box-shadow: 0 0 0 3px rgba(255,159,10,.18);
}
.field-input::placeholder{ color: rgba(255,255,255,.32); font-weight:600; }

/* ---------- TABS ---------- */
.tabs{
  display:flex;
  padding: 4px;
  border-radius: 14px;
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.08);
  gap: 3px;
  margin-top: 4px;
}
.tab{
  flex:1;
  appearance:none;
  border:none;
  background: transparent;
  color: rgba(255,255,255,.65);
  font-family: inherit;
  font-weight: 900;
  font-size: 12.5px;
  letter-spacing:.2px;
  padding: 12px 12px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background .15s ease, color .15s ease;
  touch-action: manipulation;
}
.tab i{ font-size: 13px; }
.tab:hover{ color: #fff; background: rgba(255,255,255,.06); }
.tab.active{
  background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
  color:#1a1000;
  box-shadow: 0 4px 12px var(--accent-shadow), inset 0 1px 0 rgba(255,255,255,.35);
}
.tab.active i{ color:#1a1000; }

.panel{ display:none; padding-top: 4px; }
.panel.active{ display:block; }

/* ---------- FA PICKER ---------- */
.fa-preview{
  display:flex;
  align-items:center;
  gap: 16px;
  padding: 16px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  margin-top: 12px;
}
.fa-preview-box{
  width: 60px; height: 60px;
  display:flex; align-items:center; justify-content:center;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(255,159,10,.25), rgba(255,159,10,.06));
  border: 1px solid rgba(255,159,10,.35);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 8px 20px -8px rgba(255,159,10,.35);
  font-size: 30px;
  color: #fff;
  flex-shrink:0;
}
.fa-preview-label{
  font-size: 12px;
  color: rgba(255,255,255,.55);
  font-weight: 700;
  word-break: break-all;
  flex:1;
  min-width:0;
  line-height: 1.5;
}
.fa-preview-label strong{
  display: block;
  color: #fff;
  font-size: 13.5px;
  font-weight: 900;
  margin-bottom: 4px;
  letter-spacing:-.005em;
}

.fa-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
  gap: 8px;
  margin-top: 14px;
  max-height: 260px;
  overflow-y: auto;
  padding: 6px;
  border-radius: 12px;
  background: rgba(0,0,0,.2);
  scrollbar-width: thin;
}
.fa-grid::-webkit-scrollbar{ width:5px; }
.fa-grid::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.16); border-radius:3px; }

.fa-item{
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.06);
  background: rgba(255,255,255,.04);
  color: rgba(255,255,255,.85);
  font-size: 20px;
  cursor: pointer;
  padding: 0;
  transition: background .14s ease, transform .12s ease, border-color .14s ease, color .14s ease;
  touch-action: manipulation;
}
.fa-item:hover{ background: rgba(255,255,255,.10); color:#fff; transform: translateY(-1px); }
.fa-item:active{ transform: scale(.92); }
.fa-item.active{
  background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%);
  border-color: rgba(255,255,255,.35);
  color:#1a1000;
  box-shadow: 0 6px 16px var(--accent-shadow), inset 0 1px 0 rgba(255,255,255,.4);
}

/* ---------- CROP (16:9 locked rectangle) ---------- */
.crop-container{ margin-top: 16px; }

.crop-stage{
  position: relative;
  width: 100%;
  height: 340px;
  border-radius: var(--radius-sm);
  background:
    repeating-conic-gradient(rgba(255,255,255,.04) 0% 25%, transparent 0% 50%) 50% / 20px 20px,
    rgba(0,0,0,.4);
  border: 1px solid rgba(255,255,255,.08);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  touch-action: none;
}
@media (max-width: 560px){
  .crop-stage{ height: 260px; }
}

.crop-frame{
  position: relative;
  display: block;
  max-width: 100%;
  max-height: 100%;
  box-shadow: 0 12px 40px rgba(0,0,0,.6);
}
.crop-frame img{
  display: block;
  width: 100%;
  height: 100%;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* Rectangular crop box (16:9) — no border-radius */
.crop-box{
  position: absolute;
  box-sizing: border-box;
  border: 2px solid #fff;
  border-radius: 0;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.6) inset;
  cursor: move;
  touch-action: none;
}
.crop-grid{
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(90deg, transparent calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
    linear-gradient(0deg, transparent calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% + .5px), transparent calc(66.66% + .5px));
}

/* Square corner handles (not circular) */
.crop-handle{
  position: absolute;
  width: 20px;
  height: 20px;
  background: #fff;
  border-radius: 3px;
  box-shadow:
    0 2px 6px rgba(0,0,0,.6),
    inset 0 -3px 0 var(--accent),
    inset 0 0 0 2px #fff;
  touch-action: none;
  z-index: 3;
}
.crop-handle::after{
  content:"";
  position: absolute;
  inset: 5px 5px auto auto;
  width: 8px; height: 8px;

.crop-handle[data-h="se"]{ bottom:-10px; right:-10px; cursor: nwse-resize; }

  /* ============================================================
     STORAGE
     ============================================================ */
  var storageOK = (function(){
    try {
      localStorage.setItem("__appgrid_test__", "1");
      localStorage.removeItem("__appgrid_test__");
      return true;
    } catch(e){ return false; }
  })();

  function loadAll(){
    try {
      var s = localStorage.getItem(LS_SHORTCUTS);
      if (s) state.shortcuts = JSON.parse(s) || [];
    } catch(e){}
    try {
      var st = localStorage.getItem(LS_SETTINGS);
      if (st) {
        var p = JSON.parse(st);
        if (p && typeof p === "object") {
          if (typeof p.bgColor === "string") state.settings.bgColor = p.bgColor;
          if (typeof p.wallpaperOpacity === "number") state.settings.wallpaperOpacity = p.wallpaperOpacity;
        }
      }
    } catch(e){}
    try {
      var w = localStorage.getItem(LS_WALLPAPER);
      if (w) state.wallpaper = w;
    } catch(e){}
  }

  function saveShortcuts(){
    if (!storageOK) return false;
    try {
      localStorage.setItem(LS_SHORTCUTS, JSON.stringify(state.shortcuts));
      return true;
    } catch(e){
      console.warn("[appgrid] shortcuts save failed", e);
      return false;
    }
  }
  function saveSettings(){
    if (!storageOK) return false;
    try {
      localStorage.setItem(LS_SETTINGS, JSON.stringify(state.settings));
      return true;
    } catch(e){ return false; }
  }
  function saveWallpaper(dataUrl){
    if (!storageOK) return "no-storage";
    try {
      if (dataUrl === null) {
        localStorage.removeItem(LS_WALLPAPER);
        state.wallpaper = null;
        return "ok";
      }
      localStorage.setItem(LS_WALLPAPER, dataUrl);
      state.wallpaper = dataUrl;
      return "ok";
    } catch(e){
      if (e && (e.name === "QuotaExceededError" || e.code === 22 || e.code === 1014)) {
        return "quota";
      }
      return "error";
    }
  }

  /* ============================================================
     UTILITIES
     ============================================================ */
  function uid(){
    return "s_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }
  function normalizeUrl(u){
    u = String(u || "").trim();
    if (!u) return "";
    if (!/^https?:\/\//i.test(u) && !/^ftp:\/\//i.test(u) && !/^mailto:/i.test(u)) {
      return "https://" + u;
    }
    return u;
  }
  function toast(msg, type){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast show" + (type ? " " + type : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove("show"); }, 2600);
  }
  function colorForName(name){
    var h = 0;
    var s = String(name || "x");
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return TILE_COLORS[Math.abs(h) % TILE_COLORS.length];
  }

  /* ============================================================
     TILE RENDERING
     ============================================================ */
  function buildTile(shortcut){
    var tile = document.createElement("div");
    tile.className = "tile";
    tile.dataset.id = shortcut.id;
    tile.setAttribute("role", "button");
    tile.setAttribute("tabindex", "0");

    if (shortcut.iconType === "url" && shortcut.iconValue) {
      /* --- Image tile: fills the whole tile --- */
      var media = document.createElement("div");
      media.className = "tile-media";
      var img = document.createElement("img");
      img.alt = "";
      img.referrerPolicy = "no-referrer";
      img.decoding = "async";

      var c = shortcut.crop;
      var cw = (c && c.w > 0) ? c.w : 1;
      var ch = (c && c.h > 0) ? c.h : 1;
      var cx = (c && typeof c.x === "number") ? c.x : 0;
      var cy = (c && typeof c.y === "number") ? c.y : 0;

      img.style.width  = (100 / cw) + "%";
      img.style.height = (100 / ch) + "%";
      img.style.left   = (-cx * 100 / cw) + "%";
      img.style.top    = (-cy * 100 / ch) + "%";
      img.style.objectFit = "fill";

      img.onerror = function(){
        media.innerHTML = "";
        media.style.background = "linear-gradient(135deg,#3b82f6,#1e3a8a)";
        var fb = document.createElement("i");
        fb.className = DEFAULT_ICON;
        fb.style.cssText = "position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.4)";
        media.appendChild(fb);
      };
      img.src = shortcut.iconValue;

      media.appendChild(img);
      tile.appendChild(media);

    } else {
      /* --- FA icon tile with gradient --- */
      var colors = colorForName(shortcut.name || "");
      var faBg = document.createElement("div");
      faBg.className = "tile-fa-bg";
      faBg.style.setProperty("--tc1", colors[0]);
      faBg.style.setProperty("--tc2", colors[1]);
      tile.appendChild(faBg);

      var faIcon = document.createElement("div");
      faIcon.className = "tile-fa-icon";
      var i = document.createElement("i");
      i.className = shortcut.iconValue || DEFAULT_ICON;
      faIcon.appendChild(i);
      tile.appendChild(faIcon);
    }

    /* Gradient overlay for name */
    var overlay = document.createElement("div");
    overlay.className = "tile-overlay";
    tile.appendChild(overlay);

    /* Hover dot */
    var dot = document.createElement("div");
    dot.className = "tile-dot";
    tile.appendChild(dot);

    /* Name */
    var content = document.createElement("div");
    content.className = "tile-content";
    var nameEl = document.createElement("div");
    nameEl.className = "tile-name";
    nameEl.textContent = shortcut.name || "Untitled";
    content.appendChild(nameEl);
    tile.appendChild(content);

    attachTileEvents(tile, shortcut);
    return tile;
  }

  function renderGrid(){
    var grid = document.getElementById("grid");
    var empty = document.getElementById("emptyState");
    grid.innerHTML = "";

    if (!state.shortcuts.length){
      empty.style.display = "flex";
      return;
    }
    empty.style.display = "none";

    var frag = document.createDocumentFragment();
    state.shortcuts.forEach(function(s){
      frag.appendChild(buildTile(s));
    });
    grid.appendChild(frag);

    animateTilesIn();
  }

  function animateTilesIn(){
    if (typeof gsap === "undefined") return;
    var tiles = document.querySelectorAll(".tile");
    if (!tiles.length) return;
    gsap.fromTo(tiles,
      { y: 24, opacity: 0, scale: 0.94 },
      { y: 0, opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.4)",
        stagger: { each: 0.05, from: "start" }, clearProps: "transform" }
    );
  }

  /* ============================================================
     TILE EVENTS
     ============================================================ */
  function attachTileEvents(tile, shortcut){
    var pressTimer = null;
    var longPressed = false;
    var startX = 0, startY = 0;
    var moved = false;

    function cancel(){
      if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
      tile.classList.remove("pressing");
    }

    tile.addEventListener("pointerdown", function(e){
      if (e.button && e.button !== 0) return;
      longPressed = false;
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
      tile.classList.add("pressing");
      pressTimer = setTimeout(function(){
        pressTimer = null;
        longPressed = true;
        tile.classList.remove("pressing");
        if (navigator.vibrate) { try { navigator.vibrate(18); } catch(err){} }
        openEditModal(shortcut);
      }, 500);
    });

    tile.addEventListener("pointermove", function(e){
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8){
        moved = true;
        cancel();
      }
    });

    tile.addEventListener("pointerup", function(){
      var wasLong = longPressed;
      cancel();
      if (wasLong || moved) return;
      if (!shortcut.url) return;
      window.location.href = normalizeUrl(shortcut.url);
    });

    tile.addEventListener("pointercancel", cancel);
    tile.addEventListener("pointerleave", cancel);
    tile.addEventListener("contextmenu", function(e){ e.preventDefault(); });

    tile.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " "){

        if (shortcut.url) window.location.href = normalizeUrl(shortcut.url);
      }
    });

  /* ============================================================
     CROP (16:9 LOCKED RECTANGLE)
     ============================================================ */
  function loadCropImage(url, existingCrop){
    modal.iconUrl = url;
    modal.imageLoaded = false;

    cropImage.removeAttribute("src");
    cropImage.onload = function(){
      modal.imageLoaded = true;
      initCropBox(existingCrop);
    };
    cropImage.onerror = function(){
      modal.imageLoaded = false;
      toast("Couldn't load that image", "error");
      cropContainer.style.display = "none";
    };
    setTimeout(function(){ cropImage.src = url; }, 20);
  }

  function initCropBox(existingCrop){
    requestAnimationFrame(function(){
      var stageRect = cropStage.getBoundingClientRect();
      var natW = cropImage.naturalWidth || 1;
      var natH = cropImage.naturalHeight || 1;
      var stageW = stageRect.width;
      var stageH = stageRect.height;
      if (!stageW || !stageH) return;

      var scale = Math.min(stageW / natW, stageH / natH, 1);
      var frameW = Math.max(80, Math.floor(natW * scale));
      var frameH = Math.max(80, Math.floor(natH * scale));

      cropFrame.style.width = frameW + "px";
      cropFrame.style.height = frameH + "px";

      crop.frameW = frameW;
      crop.frameH = frameH;

      if (existingCrop && existingCrop.w > 0 && existingCrop.h > 0) {
        crop.boxW = Math.max(MIN_CROP, Math.min(frameW, existingCrop.w * frameW));
        crop.boxH = crop.boxW / TILE_RATIO;
        if (crop.boxH > frameH) {
          crop.boxH = frameH;
          crop.boxW = crop.boxH * TILE_RATIO;
        }
        crop.boxL = Math.max(0, Math.min(frameW - crop.boxW, existingCrop.x * frameW));
        crop.boxT = Math.max(0, Math.min(frameH - crop.boxH, existingCrop.y * frameH));
      } else {
        // Default: largest 16:9 rectangle that fits, centered
        var targetW, targetH;
        if (frameW / frameH > TILE_RATIO) {
          // frame is wider than 16:9 — fit by height
          targetH = frameH;
          targetW = targetH * TILE_RATIO;
        } else {
          targetW = frameW;
          targetH = targetW / TILE_RATIO;
        }
        crop.boxW = Math.floor(targetW * 0.92);
        crop.boxH = Math.floor(targetH * 0.92);
        crop.boxL = Math.floor((frameW - crop.boxW) / 2);
        crop.boxT = Math.floor((frameH - crop.boxH) / 2);
      }

      crop.active = true;
      updateCropBoxVisual();
    });
  }

  function updateCropBoxVisual(){
    cropBox.style.left = crop.boxL + "px";
    cropBox.style.top = crop.boxT + "px";
    cropBox.style.width = crop.boxW + "px";
    cropBox.style.height = crop.boxH + "px";
  }

  cropBox.addEventListener("pointerdown", function(e){
    if (e.target.classList.contains("crop-handle")) return;
    if (!crop.active) return;
    e.preventDefault();
    e.stopPropagation();
    startCropDrag(e, "move");
  });
  document.querySelectorAll(".crop-handle").forEach(function(h){
    h.addEventListener("pointerdown", function(e){
      if (!crop.active) return;
      e.preventDefault();
      e.stopPropagation();
      startCropDrag(e, h.dataset.h);
    });
  });

  function startCropDrag(e, mode){
    crop.dragMode = mode;
    crop.dragStartX = e.clientX;
    crop.dragStartY = e.clientY;
    crop.dragStartL = crop.boxL;
    crop.dragStartT = crop.boxT;
    crop.dragStartW = crop.boxW;
    crop.dragStartH = crop.boxH;
    document.addEventListener("pointermove", onCropDragMove);
    document.addEventListener("pointerup", onCropDragEnd);
    document.addEventListener("pointercancel", onCropDragEnd);
    try { e.target.setPointerCapture(e.pointerId); } catch(err){}
  }

  function onCropDragMove(e){
    if (!crop.dragMode) return;
    e.preventDefault();

    var fw = crop.frameW, fh = crop.frameH;
    var minW = MIN_CROP;
    var minH = MIN_CROP / TILE_RATIO;

    if (crop.dragMode === "move"){
      var dx = e.clientX - crop.dragStartX;
      var dy = e.clientY - crop.dragStartY;
      crop.boxL = Math.max(0, Math.min(fw - crop.boxW, crop.dragStartL + dx));
      crop.boxT = Math.max(0, Math.min(fh - crop.boxH, crop.dragStartT + dy));
      updateCropBoxVisual();
      return;
    }

    // Corner resize with locked 16:9
    var oL = crop.dragStartL, oT = crop.dragStartT;
    var oW = crop.dragStartW, oH = crop.dragStartH;
    var oR = oL + oW, oB = oT + oH;

    // Anchor = opposite corner stays fixed
    var ax, ay;
    if (crop.dragMode === "nw") { ax = oR; ay = oB; }
    else if (crop.dragMode === "ne") { ax = oL; ay = oB; }
    else if (crop.dragMode === "sw") { ax = oR; ay = oT; }
    else { ax = oL; ay = oT; } // se

    // Pointer in frame coords
    var frameRect = cropFrame.getBoundingClientRect();
    var px = e.clientX - frameRect.left;
    var py = e.clientY - frameRect.top;

    // Raw distances from anchor
    var rawW = Math.abs(px - ax);
    var rawH = Math.abs(py - ay);

    // Fit to 16:9 (use the larger dimension so drag feels natural)
    var newW, newH;
    if (rawW / rawH > TILE_RATIO) {
      newW = rawW;
      newH = rawW / TILE_RATIO;
    } else {
      newH = rawH;
      newW = rawH * TILE_RATIO;
    }

    // Max sizes allowed by anchor position
    var maxW = (crop.dragMode === "nw" || crop.dragMode === "sw") ? ax : (fw - ax);
    var maxH = (crop.dragMode === "nw" || crop.dragMode === "ne") ? ay : (fh - ay);

    // Clamp
    if (newW > maxW) { newW = maxW; newH = newW / TILE_RATIO; }
    if (newH > maxH) { newH = maxH; newW = newH * TILE_RATIO; }

    // Min
    if (newW < minW) { newW = minW; newH = newW / TILE_RATIO; }
    if (newH < minH) { newH = minH; newW = newH * TILE_RATIO; }

    // Re-clamp both
    if (newW > maxW) { newW = maxW; newH = newW / TILE_RATIO; }
    if (newH > maxH) { newH = maxH; newW = newH * TILE_RATIO; }

    // Position
    var newL, newT;
    if (crop.dragMode === "nw") { newL = ax - newW; newT = ay - newH; }
    else if (crop.dragMode === "ne") { newL = ax; newT = ay - newH; }
    else if (crop.dragMode === "sw") { newL = ax - newW; newT = ay; }
    else { newL = ax; newT = ay; }

    crop.boxL = Math.max(0, Math.min(fw - newW, newL));
    crop.boxT = Math.max(0, Math.min(fh - newH, newT));
    crop.boxW = newW;
    crop.boxH = newH;
    updateCropBoxVisual();
  }

  function onCropDragEnd(){
    crop.dragMode = null;
    document.removeEventListener("pointermove", onCropDragMove);
    document.removeEventListener("pointerup", onCropDragEnd);
    document.removeEventListener("pointercancel", onCropDragEnd);
  }

  function getCurrentCrop(){
    if (!crop.active || !crop.frameW || !crop.frameH) return null;
    return {
      x: crop.boxL / crop.frameW,
      y: crop.boxT / crop.frameH,
      w: crop.boxW / crop.frameW,
      h: crop.boxH / crop.frameH
    };
  }

  function resetCrop(){
    if (!crop.active) return;
    var targetW, targetH;
    if (crop.frameW / crop.frameH > TILE_RATIO) {
      targetH = crop.frameH;
      targetW = targetH * TILE_RATIO;
    } else {
      targetW = crop.frameW;
      targetH = targetW / TILE_RATIO;
    }
    crop.boxW = Math.floor(targetW * 0.92);
    crop.boxH = Math.floor(targetH * 0.92);
    crop.boxL = Math.floor((crop.frameW - crop.boxW) / 2);
    crop.boxT = Math.floor((crop.frameH - crop.boxH) / 2);
    updateCropBoxVisual();
  }

  /* ============================================================
     IMAGE RESIZE
     ============================================================ */
  function resizeImage(file, maxW, maxH, quality, cb){
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(maxW / w, maxH / h, 1);
        w = Math.round(w * scale);
        h = Math.round(h * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        try {
          cb(canvas.toDataURL("image/jpeg", quality));
        } catch(e){
          toast("Couldn't process that image", "error");
        }
      };
      img.onerror = function(){ toast("Couldn't load image", "error"); };
      img.src = ev.target.result;
    };
    reader.onerror = function(){ toast("Couldn't read file", "error"); };
    reader.readAsDataURL(file);
  }

  /* ============================================================
     INPUTMODE=NONE
     ============================================================ */
  function applyInputModeNone(){
    document.querySelectorAll('input:not([type]),input[type="text"],input[type="url"],input[type="search"],input[type="email"],input[type="tel"],input[type="password"],textarea,[contenteditable="true"]').forEach(function(el){
      if (el.type === "color" || el.type === "file" || el.type === "range") return;
      el.setAttribute("inputmode", "none");
      el.setAttribute("autocorrect", "off");
      el.setAttribute("autocapitalize", "off");
      el.setAttribute("spellcheck", "false");
      el.setAttribute("virtualkeyboardpolicy", "manual");
    });
  }
  applyInputModeNone();
  if (window.MutationObserver) {
    new MutationObserver(applyInputModeNone).observe(document.body, { childList: true, subtree: true });
  }

  /* ============================================================
     KEYBOARD SCROLL-ON-FOCUS
     ============================================================ */
  editBody.addEventListener("focusin", function(e){
    var el = e.target;
    if (!el.matches || !el.matches("input, textarea")) return;
    setTimeout(function(){
      var kbWrap = document.getElementById("kbWrap");
      var kbH = kbWrap ? kbWrap.offsetHeight : 0;
      if (!kbH) return;
      var rect = el.getBoundingClientRect();
      var visibleBottom = window.innerHeight - kbH - 20;
      if (rect.bottom > visibleBottom){
        editBody.scrollTop += (rect.bottom - visibleBottom);
      }
    }, 340);
  });

  /* ============================================================
     ESC
     ============================================================ */
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      if (settingsBackdrop.classList.contains("open")) { closeSettings(); return; }
      if (editBackdrop.classList.contains("open")) { closeEditModal(); return; }
    }
  });

  /* ============================================================
     SCROLL FADE
     ============================================================ */
  var scrollFade = document.getElementById("scrollFade");
  window.addEventListener("scroll", function(){
    scrollFade.classList.toggle("visible", window.scrollY > 10);
  }, { passive: true });

  /* ============================================================
     INIT
     ============================================================ */
  function init(){
    loadAll();
    renderBgPresets();
    applyBgColor();
    applyWallpaper();
    renderGrid();

    if (!storageOK) {
      setTimeout(function(){ toast("Storage is blocked — nothing will persist", "error"); }, 600);
    }

    if (typeof gsap !== "undefined") {
      gsap.from("header.app-header", { y: -16, opacity: 0, duration: 0.5, ease: "power3.out" });
      gsap.from(".icon-btn", { scale: 0.6, opacity: 0, duration: 0.4, stagger: 0.06, ease: "back.out(2)", delay: 0.15 });
    }

    ["addBtn","settingsBtn"].forEach(function(id){
      var el = document.getElementById(id);
      el.addEventListener("pointerenter", function(){
        if (typeof gsap !== "undefined") gsap.to(el, { scale: 1.06, duration: 0.18, ease: "power2.out" });
      });
      el.addEventListener("pointerleave", function(){
        if (typeof gsap !== "undefined") gsap.to(el, { scale: 1, duration: 0.18, ease: "power2.out" });
      });
    });

    console.log("[appgrid] ready ✔  storage:", storageOK, " shortcuts:", state.shortcuts.length);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
